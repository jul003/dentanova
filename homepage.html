<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dentanova</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-gradient-to-b from-cyan-500 to-blue-900 text-white font-sans">

    <!-- HERO SECTION -->
    <section id="home-section" class="min-h-screen flex flex-col justify-center items-center text-center px-6">
        <h1 class="text-5xl font-extrabold mb-4">DENTANOVA</h1>
        <p class="text-sm uppercase tracking-widest text-blue-200 mb-6">Digital Solutions for Brilliant Smiles</p>
        <img src="img/homepage.png" class="w-48 h-48 mb-6" alt="Illustration" />

        <!-- Scroll Button -->
        <a href="#menu-section"
            class="mt-6 inline-block animate-bounce text-white text-sm border border-white px-4 py-2 rounded-full">
            ↓ Explore Features
        </a>
    </section>


    <!-- MENU SECTION -->
    <section id="menu-section"
        class="min-h-screen bg-gradient-to-b from-blue-900 to-indigo-900 pt-10 pb-24 px-4 flex flex-col items-center">

        <!-- Logo + Brand -->
        <div class="flex flex-col items-center mb-6">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-widest">DENTANOVA</h1>
                <img src="img/dentanovaaa.png" alt="Dentanova Logo" class="w-24 h-24 sm:w-48 sm:h-48" />
            </div>
        </div>

        <h2 class="text-2xl font-bold text-white mb-8">Main Features</h2>

        <!-- MENU GRID -->
        <div class="grid grid-cols-2 sm:grid-cols-2 gap-6 max-w-sm w-full">

            <!-- Toothman Adventure -->
            <a href="qr.html"
                class="flex flex-col items-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition">
                <img src="img/adventure.png" alt="Toothman Icon" class="h-40 w-40 mb-2 object-contain" />
                <span class="text-sm text-center text-gray-800 font-medium block">Toothman<br>Adventure</span>
            </a>

            <!-- Parent Hub -->
            <a href="parent.html"
                class="flex flex-col items-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition">
                <img src="img/parent.png" alt="Parent Hub Icon" class="h-40 w-40 mb-2 object-contain" />
                <span class="text-sm text-center text-gray-800 font-medium">Parent Hub</span>
            </a>

            <!-- Quiz -->
            <a href="quiz.html"
                class="flex flex-col items-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition">
                <img src="img/quiz.webp" alt="Quiz Icon" class="h-40 w-40 mb-2 object-contain" />
                <span class="text-sm text-center text-gray-800 font-medium">Toothquest</span>
            </a>

            <!-- Toothpedia -->
            <a href="toothpedia.html"
                class="flex flex-col items-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition">
                <img src="img/toothpedia.png" alt="Toothpedia Icon" class="h-40 w-40 mb-2 object-contain" />
                <span class="text-sm text-center text-gray-800 font-medium">Toothpedia</span>
            </a>

        </div>

    </section>


    <section
        class="w-full bg-gradient-to-br from-blue-800 to-indigo-900 px-4 py-10 flex flex-col md:flex-row items-center justify-center gap-6">
        <!-- Text Section -->
        <div class="text-center md:text-left">
            <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white tracking-widest mb-2">
                DENTAL <span class="text-blue-300">INOVATION</span>
            </h2>
            <p class="text-sm sm:text-base text-blue-200 font-medium tracking-wide">
                DIGITAL SOLUTIONS FOR <br class="hidden sm:block" />
                <span class="text-white">BRILLIANT SMILES</span>
            </p>
        </div>

        <!-- Maskot Image -->
        <div class="w-80 h-80 md:w-52 md:h-52 flex-shrink-0">
            <img src="img/toothman.png" alt="Mascot" class="object-contain w-full h-full" />
        </div>
    </section>


    <!-- BOTTOM NAVIGATION -->
    <footer
        class="fixed bottom-0 inset-x-0 bg-white bg-opacity-10 backdrop-blur-md text-white py-3 px-6 flex justify-around rounded-t-2xl md:static md:rounded-none md:bg-opacity-0">
        <a href="#home-section" class="flex flex-col items-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            </svg>
            <span class="text-xs">Home</span>
        </a>
        <a href="#menu-section" class="flex flex-col items-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <span class="text-xs">Menu</span>
        </a>
        <div class="flex flex-col items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5.121 17.804A4 4 0 018 20h8a4 4 0 013.121-2.196M15 11a4 4 0 10-8 0 4 4 0 008 0z" />
            </svg>
            <span class="text-xs">Profile</span>
        </div>
    </footer>

</body>

</html>
