<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toothman Adventure - QR Scanner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- 3D Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    #qr-reader__dashboard_section_csr,
    #qr-reader__dashboard_section_swaplink {
      display: none !important; /* hide unused buttons */
    }

    #qr-reader__dashboard {
      background: transparent !important;
      padding: 0 !important;
    }

    #qr-reader__camera_feed {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #qr-reader {
      width: 100%;
      height: 100%;
      max-width: none !important;
      aspect-ratio: auto !important;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-blue-900 to-indigo-900 text-white font-sans flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="text-center py-6">
    <h1 class="text-3xl font-bold">Toothman QR Scanner</h1>
    <p class="text-sm text-blue-200 mt-2">Point your camera at a QR Code</p>
  </header>

  <!-- MAIN SCANNER -->
  <main class="flex-grow flex flex-col items-center justify-center p-0 m-0">
    <div id="qr-reader" class="w-full h-[calc(100vh-180px)] bg-black overflow-hidden rounded-lg shadow-lg"></div>
    <div id="qr-result" class="mt-4 text-green-300 text-sm font-mono"></div>

    <!-- Model Viewer -->
    <model-viewer
      id="ar-viewer"
      class="mt-6 hidden"
      src=""
      alt="3D Model"
      auto-rotate
      camera-controls
      ar
      ar-modes="scene-viewer webxr quick-look"
      style="width: 100%; max-width: 400px; height: 400px;"
    ></model-viewer>
  </main>

  <!-- FOOTER NAV -->
  <footer class="bg-white bg-opacity-10 backdrop-blur-md text-white py-3 px-6 flex justify-around rounded-t-2xl">
    <a href="homepage.html" class="flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
      </svg>
      <span class="text-xs">Home</span>
    </a>
    <a href="index.html#menu-section" class="flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="text-xs">Menu</span>
    </a>
    <a href="#" class="flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A4 4 0 018 20h8a4 4 0 013.121-2.196M15 11a4 4 0 10-8 0 4 4 0 008 0z" />
      </svg>
      <span class="text-xs">Profile</span>
    </a>
  </footer>

  <!-- SCRIPT QR SCANNER -->
  <script>
    const qrReader = new Html5Qrcode("qr-reader");
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const cameraFacing = isMobile ? { facingMode: "environment" } : { facingMode: "user" };

    qrReader.start(
      cameraFacing,
      {
        fps: 10,
        qrbox: (w, h) => {
          const edge = Math.min(w, h) * 0.9;
          return { width: edge, height: edge };
        },
      },
      (decodedText) => {
        document.getElementById("qr-result").innerText = `Scanned: ${decodedText}`;

        // Tampilkan AR model jika hasil QR mengarah ke file .glb
        if (decodedText.endsWith(".glb")) {
          const modelViewer = document.getElementById("ar-viewer");
          modelViewer.src = decodedText;
          modelViewer.classList.remove("hidden");
        }

        qrReader.stop();
      },
      (err) => {
        // Silent error
      }
    );
  </script>

</body>
</html>
